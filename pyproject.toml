[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-covariance"
version = "0.1.0"
description = "Comparative study of covariance estimators for portfolio risk measurement and construction."
requires-python = ">=3.14"
readme = "README.md"
authors = [{ name = "Marco Serra" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "fredapi.*", "arch.*", "cvxpy.*", "pandas_market_calendars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
